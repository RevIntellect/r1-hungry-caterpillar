<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Hungry Caterpillar — a self-contained Rabbit R1 snake-style game. Play in the browser or on device.">
<title>Hungry Caterpillar</title>
<style>
html,body{margin:0;min-height:100%;background:#16361a;font-family:sans-serif;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:240px;height:282px;overflow:hidden;background:#16361a}
#g{width:240px;height:250px;display:block;background:#1d4a24}
#bar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#0f2412;font-size:12px}
#sc{color:#ffd56a;font-weight:700}
#go{position:absolute;top:90px;left:20px;width:200px;text-align:center;background:rgba(0,0,0,.55);padding:10px 0;display:none}
</style>
</head>
<body>
<div id="app">
<canvas id="g" width="240" height="250"></canvas>
<div id="bar"><span id="sc">0</span><span id="ms">tap / scroll</span></div>
<div id="go">hungry caterpillar<br>tap to start</div>
</div>
<script>
var W=240,H=250,S=10,COLS=24,ROWS=25;
var c=document.getElementById('g'),x=c.getContext('2d');
var sc=document.getElementById('sc'),ms=document.getElementById('ms'),go=document.getElementById('go');
var FOOD=[{e:'A',col:'#e33',p:1},{e:'P',col:'#8c3',p:1},{e:'G',col:'#84e',p:2},{e:'C',col:'#f80',p:1},{e:'B',col:'#3a5',p:2},{e:'N',col:'#fc3',p:1},{e:'D',col:'#f8a',p:3}];
var snake,dir,ndir,food,score,dead,speed,timer,started=false;
function reset(){
  snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];
  dir={x:1,y:0}; ndir={x:1,y:0};
  score=0; dead=false; speed=200;
  sc.textContent='0'; ms.textContent='eat!'; go.style.display='none';
  place();
}
function occ(a,b){for(var i=0;i<snake.length;i++)if(snake[i].x===a&&snake[i].y===b)return true;return false}
function place(){
  var a,b,n=0;
  do{a=1+((Math.random()*22)|0);b=1+((Math.random()*23)|0);}while(occ(a,b)&&++n<60);
  var f=FOOD[(Math.random()*FOOD.length)|0];
  food={x:a,y:b,e:f.e,col:f.col,p:f.p};
}
function turn(nx,ny){
  if(!started){started=true;reset();return}
  if(dead){reset();return}
  if(nx===-dir.x&&ny===-dir.y)return;
  ndir={x:nx,y:ny};
}
function step(){
  if(!started||dead)return;
  dir=ndir;
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||occ(h.x,h.y)){
    dead=true; ms.textContent='tap restart'; go.style.display='block'; go.innerHTML='full tummy<br>tap to play'; return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score+=food.p; sc.textContent=''+score;
    if(speed>90)speed-=6;
    place();
  } else snake.pop();
}
function draw(){
  x.fillStyle='#1d4a24'; x.fillRect(0,0,W,H);
  var i,s,px,py;
  for(i=0;i<snake.length;i++){
    s=snake[i]; px=s.x*S; py=s.y*S;
    x.fillStyle=i===0?'#3dcc4a':(i<snake.length/2?'#6fe05a':'#c9e85a');
    x.fillRect(px+1,py+1,S-2,S-2);
  }
  if(food){
    x.fillStyle=food.col;
    x.fillRect(food.x*S+1,food.y*S+1,S-2,S-2);
    x.fillStyle='#fff'; x.font='9px sans-serif'; x.textAlign='center';
    x.fillText(food.e, food.x*S+5, food.y*S+8);
  }
}
function loop(){ step(); draw(); }
reset(); draw();
go.style.display='block';
clearInterval(timer);
timer=setInterval(loop, 200);
window.addEventListener('scrollUp', function(){ if(dir.x!==0) turn(0,-1); else turn(-1,0); });
window.addEventListener('scrollDown', function(){ if(dir.x!==0) turn(0,1); else turn(1,0); });
window.addEventListener('sideClick', function(){ if(!started||dead) turn(1,0); });
c.addEventListener('pointerup', function(e){
  if(!started||dead){ turn(1,0); return; }
  var r=c.getBoundingClientRect();
  var tx=(e.clientX-r.left)*(W/r.width);
  var ty=(e.clientY-r.top)*(H/r.height);
  var hx=snake[0].x*S+5, hy=snake[0].y*S+5;
  if(Math.abs(tx-hx)>Math.abs(ty-hy)) turn(tx>hx?1:-1,0);
  else turn(0, ty>hy?1:-1);
});
window.addEventListener('keydown', function(e){
  if(e.key==='ArrowUp') turn(0,-1);
  if(e.key==='ArrowDown') turn(0,1);
  if(e.key==='ArrowLeft') turn(-1,0);
  if(e.key==='ArrowRight') turn(1,0);
  if(e.key==='Enter'||e.key===' ') turn(1,0);
});
</script>
</body>
</html>
